name: Bug report
description: Report a problem with BotDrop Host
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a bot...
        2. Click Start Bot...
        3. See error...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens or secrets before pasting logs.
